  <body>
    <div id="root"></div>
    <div id="wbg-fab" title="Customize appearance">🎨 Customize</div>
    <div id="wbg-prefs">
      <div class="wbg-hd"><span>Appearance</span><span class="wbg-x" id="wbg-close" title="Close">✕</span></div>
      <div class="wbg-row"><span>Theme preset</span>

      </div>
      <div class="wbg-row"><span>Background color</span>
        <div class="wbg-swatches">
          <span class="wbg-sw" data-bg="#ffffff" style="background:#ffffff" title="White"></span>
          <span class="wbg-sw" data-bg="#f0f2f5" style="background:#f0f2f5" title="Light grey"></span>

          <span class="wbg-sw" data-bg="#f0fff4" style="background:#f0fff4" title="Pale green"></span>
          <span class="wbg-sw" data-bg="#0f1420" style="background:#0f1420" title="Near black"></span>
          <span class="wbg-pick"><input type="color" id="wbg-bgpick" value="#ffffff" title="Pick any color"></span>
        </div>
      </div>
      <div class="wbg-row"><span>Font</span>
        <select id="wbg-font">
          <optgroup label="Sans-serif">
            <option value="">Arial Narrow (default)</option>
            <option value="Roboto">Roboto</option>
            <option value="Open Sans">Open Sans</option>
            <option value="Inter">Inter</option>
            <option value="Lato">Lato</option>
            <option value="Poppins">Poppins</option>
            <option value="Montserrat">Montserrat</option>
            <option value="Nunito">Nunito</option>
            <option value="Helvetica">Helvetica / Arial</option>
            <option value="Segoe UI">Segoe UI</option>
            <option value="San Francisco">San Francisco (Apple)</option>
          </optgroup>
          <optgroup label="Serif">
            <option value="Georgia">Georgia</option>
            <option value="Merriweather">Merriweather</option>
            <option value="Playfair Display">Playfair Display</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Lora">Lora</option>
          </optgroup>
          <optgroup label="Monospace">
            <option value="JetBrains Mono">JetBrains Mono</option>
            <option value="Fira Code">Fira Code</option>
            <option value="Source Code Pro">Source Code Pro</option>
            <option value="Consolas">Consolas</option>
          </optgroup>
        </select>
      </div>
      <button class="wbg-reset" id="wbg-reset">↺ Reset to default (Arial Narrow, white)</button>
    </div>
    <script>
      (function(){
        var FONTS = {
          "": {css:"'Arial Narrow','Helvetica Neue Condensed',Arial,sans-serif"},
          "Roboto": {css:"'Roboto',sans-serif", g:"Roboto:wght@400;700"},
          "Open Sans": {css:"'Open Sans',sans-serif", g:"Open+Sans:wght@400;700"},
          "Inter": {css:"'Inter',sans-serif", g:"Inter:wght@400;700"},
          "Lato": {css:"'Lato',sans-serif", g:"Lato:wght@400;700"},
          "Poppins": {css:"'Poppins',sans-serif", g:"Poppins:wght@400;700"},
          "Montserrat": {css:"'Montserrat',sans-serif", g:"Montserrat:wght@400;700"},
          "Nunito": {css:"'Nunito',sans-serif", g:"Nunito:wght@400;700"},
          "Helvetica": {css:"Helvetica,Arial,sans-serif"},
          "Segoe UI": {css:"'Segoe UI',Tahoma,sans-serif"},
          "San Francisco": {css:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"},
          "Georgia": {css:"Georgia,'Times New Roman',serif"},
          "Merriweather": {css:"'Merriweather',Georgia,serif", g:"Merriweather:wght@400;700"},
          "Playfair Display": {css:"'Playfair Display',Georgia,serif", g:"Playfair+Display:wght@400;700"},
          "Times New Roman": {css:"'Times New Roman',Times,serif"},
          "Lora": {css:"'Lora',Georgia,serif", g:"Lora:wght@400;700"},
          "JetBrains Mono": {css:"'JetBrains Mono',monospace", g:"JetBrains+Mono:wght@400;700"},
          "Fira Code": {css:"'Fira Code',monospace", g:"Fira+Code:wght@400;700"},
          "Source Code Pro": {css:"'Source Code Pro',monospace", g:"Source+Code+Pro:wght@400;700"},
          "Consolas": {css:"Consolas,'Courier New',monospace"}
        };
        var root=document.documentElement;
        var fab=document.getElementById('wbg-fab'), panel=document.getElementById('wbg-prefs');
        var themeSel=document.getElementById('wbg-theme'), fontSel=document.getElementById('wbg-font'), bgpick=document.getElementById('wbg-bgpick');
        themeSel.value = localStorage.getItem('wbg-theme') || "";
        fontSel.value = localStorage.getItem('wbg-font-name') || "";
        var savedBg = localStorage.getItem('wbg-bg'); if(savedBg){ root.style.setProperty('--wbg-bg', savedBg); bgpick.value = savedBg; }
        function loadGoogle(g){
          if(!g) return null;
          var href="https://fonts.googleapis.com/css2?family="+g+"&display=swap";
          if(![].some.call(document.querySelectorAll('link'),function(l){return l.href===href;})){
            var l=document.createElement('link'); l.rel='stylesheet'; l.href=href; document.head.appendChild(l);
          }
          return href;
        }
        function applyTheme(v){
          if(v) root.setAttribute('data-theme',v); else root.removeAttribute('data-theme');
          localStorage.setItem('wbg-theme',v);
          // theme preset owns the background: clear any custom bg override
          root.style.removeProperty('--wbg-bg'); localStorage.removeItem('wbg-bg');
        }
        function applyFont(name){
          var f=FONTS[name]||FONTS[""];
          root.style.setProperty('--wbg-font', f.css);
          var link = f.g ? loadGoogle(f.g) : "";
          localStorage.setItem('wbg-font-name', name);
          localStorage.setItem('wbg-font-css', f.css);
          if(link) localStorage.setItem('wbg-font-link', link); else localStorage.removeItem('wbg-font-link');
        }
        function applyBg(c){ root.style.setProperty('--wbg-bg', c); localStorage.setItem('wbg-bg', c); bgpick.value=c; }
        themeSel.onchange=function(){ applyTheme(themeSel.value); };
        fontSel.onchange=function(){ applyFont(fontSel.value); };
        bgpick.oninput=function(){ applyBg(bgpick.value); };
        [].forEach.call(document.querySelectorAll('.wbg-sw'),function(sw){ sw.onclick=function(){ applyBg(sw.getAttribute('data-bg')); }; });
        document.getElementById('wbg-reset').onclick=function(){
          themeSel.value=""; fontSel.value="";
          applyTheme(""); applyFont("");
          root.style.removeProperty('--wbg-bg'); localStorage.removeItem('wbg-bg'); bgpick.value="#ffffff";
        };
        fab.onclick=function(){ panel.style.display='flex'; fab.style.display='none'; };
        document.getElementById('wbg-close').onclick=function(){ panel.style.display='none'; fab.style.display='flex'; };
      })();
    </script>
